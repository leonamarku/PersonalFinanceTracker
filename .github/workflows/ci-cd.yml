# ──────────────────────────────────────────────────────────────────────────────
# Personal Finance Tracker – CI/CD Pipeline
# Triggers on every push / pull-request to main and release/* branches.
# Jobs: build → test → publish → deploy-to-azure (main only)
# ──────────────────────────────────────────────────────────────────────────────
name: CI/CD Pipeline

on:
  push:
    branches: [ main, "release/*" ]
  pull_request:
    branches: [ main ]

env:
  DOTNET_VERSION: '10.0.x'
  PROJECT_PATH:   'src/PersonalFinanceTracker.API/PersonalFinanceTracker.API.csproj'
  TEST_PATH:      'tests/PersonalFinanceTracker.Tests/PersonalFinanceTracker.Tests.csproj'
  AZURE_WEBAPP_NAME: 'personal-finance-tracker-api'   # ← set your Azure App Service name

jobs:
  # ── 1. Build & Test ──────────────────────────────────────────────────────────
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore NuGet packages
        run: dotnet restore PersonalFinanceTracker.sln

      - name: Build solution (Release)
        run: dotnet build PersonalFinanceTracker.sln --configuration Release --no-restore

      - name: Run unit tests with coverage
        run: |
          dotnet test ${{ env.TEST_PATH }} \
            --configuration Release \
            --no-build \
            --verbosity normal \
            --collect:"XPlat Code Coverage" \
            --results-directory ./coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ./coverage

  # ── 2. Publish ───────────────────────────────────────────────────────────────
  publish:
    name: Publish Artifact
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish API
        run: |
          dotnet publish ${{ env.PROJECT_PATH }} \
            --configuration Release \
            --output ./publish \
            --no-restore

      - name: Upload publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-artifact
          path: ./publish

  # ── 3. Deploy to Azure ───────────────────────────────────────────────────────
  deploy:
    name: Deploy to Azure App Service
    runs-on: ubuntu-latest
    needs: publish
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net

    steps:
      - name: Download publish artifact
        uses: actions/download-artifact@v4
        with:
          name: api-artifact
          path: ./publish

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name:    ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package:     ./publish
